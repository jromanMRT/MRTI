<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f2e7" />
    <meta name="description" content="MRTI, portal empresarial de Minera Río Tinto" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MRTI | Portal empresarial</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('mrti_theme');
          if (stored === 'light' || stored === 'dark') document.documentElement.setAttribute('data-theme', stored);
        } catch (error) { /* localStorage no disponible */ }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
