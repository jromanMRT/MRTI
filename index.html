<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f2e7" />
    <meta name="description" content="MRTI, portal empresarial de Minera Río Tinto" />
    <meta name="application-name" content="MRTI" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MRTI" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/company-logo.svg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MRTI | Portal empresarial</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('mrti_theme');
          if (stored === 'light' || stored === 'dark') document.documentElement.setAttribute('data-theme', stored);
        } catch (error) { /* localStorage no disponible */ }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
